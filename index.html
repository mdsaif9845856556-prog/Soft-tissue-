
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>My First App</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

header {
  background: #2563eb;
  color: white;
  padding: 28px 20px;
  border-radius: 0 0 25px 25px;
}

header h1 { margin: 10px 0; }

main { padding: 20px; }

.card {
  background: white;
  padding: 22px;
  margin: 16px 0;
  border-radius: 18px;
  box-shadow: 0 3px 12px #00000010;
}

button {
  background: #2563eb;
  color: white;
  border: 0;
  padding: 15px;
  width: 100%;
  border-radius: 12px;
  font-size: 17px;
  margin-top: 10px;
}

button:active { opacity: .8; }

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 16px 5px;
  box-shadow: 0 -2px 10px #00000010;
}

nav button {
  background: transparent;
  color: #2563eb;
  width: auto;
  margin: 0;
  padding: 8px;
  font-size: 14px;
}

#message { color: #2563eb; }
</style>
</head>

<body>

<header>
  <h1>My First App 🚀</h1>
  <p>Welcome! Your own mobile app starts here.</p>
</header>

<main>
  <section class="card">
    <h2>Home 🏠</h2>
    <p>Welcome to my application.</p>
    <button onclick="showMessage()">
      Get Started
    </button>
  </section>

  <section class="card">
    <h2>My Features</h2>
    <p>📱 Mobile friendly design</p>
    <p>🌐 Android and iPhone support</p>
    <p>⚡ Fast and simple</p>
  </section>

  <section class="card">
    <h2>My App</h2>
    <p id="message">Your app is ready to customize!</p>
  </section>
</main>

<nav>
  <button onclick="home()">🏠 Home</button>
  <button onclick="about()">ℹ️ About</button>
  <button onclick="contact()">📞 Contact</button>
</nav>

<script>
function showMessage() {
  document.getElementById("message").innerText =
    "Welcome! Your app is working successfully!";
}

function home() {
  window.scrollTo(0, 0);
}

function about() {
  alert("Welcome to my own mobile application!");
}

function contact() {
  alert("Contact details will be added here.");
}
</script>

</body>
</html>
